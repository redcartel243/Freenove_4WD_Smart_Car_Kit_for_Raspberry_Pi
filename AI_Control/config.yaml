autonomous:
  emergency_stop_distance: 15
  enabled: true
  loop_interval: 0.5
camera_calibration:
  calibrated: true
  pan_center: 80
  pan_range:
  - 30
  - 150
  tilt_center: 98
  tilt_range:
  - 30
  - 150
llm:
  base_url: http://localhost:11434
  max_tokens: 1024
  model: qwen2.5:7b-instruct
  provider: ollama
  temperature: 0.7
robot:
  command_port: 5000
  ip: 192.168.0.105
  video_port: 8000
server:
  host: 0.0.0.0
  port: 8080
vision:
  confidence_threshold: 0.5
  frame_skip: 2
  yolo_model: yolov8n.pt
vision_llm:
  base_url: http://localhost:11434
  model: moondream
  provider: ollama
